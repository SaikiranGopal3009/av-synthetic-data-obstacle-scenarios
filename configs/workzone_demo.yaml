seed: 42
road:
  length_m: 80.0
  num_lanes: 2
  lane_width_m: 3.6
obstacle:
  kind: "stalled_vehicle"
  lane_index: 0 # 0 = first lane, 1 = second lane
  s_distance_m: 28.0 # distance ahead along the lane (m)
  d_offset_m: 0.0 # lateral offset from lane centerline (m)
  length_m: 4.2
  width_m: 1.8
  height_m: 1.5
camera:
  role: "ego_vehicle"
  x: 0.0
  y: -1.8
  z: 1.5
  fov_deg: 60.0
  img_width: 800
  img_height: 450
ego:
  vehicle_id: ego_vehicle
  camera:
    name: ego_front_camera
    frame: ego_vehicle
    role: "ego_vehicle"
    position_m: [0.0, 1.8, 1.5]
    fov_deg: 60.0
output:
  dir: "outputs/samples"
